[package]
name = "reqowl-core"
description = "Core of reqowl: notebook pages with runnable HTTP blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", features = ["gzip", "brotli", "deflate", "zstd", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.9"
time = { version = "0.3", features = ["formatting"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
