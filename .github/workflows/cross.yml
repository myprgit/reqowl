# macOS and Windows runners use private-repo minutes much faster than Linux,
# so this runs only when started by hand (Actions tab → cross → Run workflow).
name: cross
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p reqowl-cli
      - uses: actions/upload-artifact@v4
        with:
          name: reqowl-cli-${{ matrix.os }}
          path: |
            target/release/reqowl
            target/release/reqowl.exe
          if-no-files-found: error
