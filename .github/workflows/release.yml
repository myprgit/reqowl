# Push a tag like v0.1.0 to build installers for all three systems and
# attach them to a draft GitHub release. Review the draft, then publish it.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: ""
            args: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional until certificates exist):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID for macOS notarization.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: reqowl ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          args: ${{ matrix.args }}

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: reqowl-linux-x86_64
            bin: reqowl
          - os: macos-latest
            name: reqowl-macos-arm64
            bin: reqowl
          - os: windows-latest
            name: reqowl-windows-x86_64.exe
            bin: reqowl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p reqowl-cli
      - shell: bash
        run: cp target/release/${{ matrix.bin }} ${{ matrix.name }}
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The app job creates the draft; wait for it, then attach the CLI.
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.name }} --clobber
